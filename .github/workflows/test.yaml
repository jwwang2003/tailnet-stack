name: Integration checks
on:
  push:
    branches: ['feature/**', 'downstream/**', 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: bash scripts/test.sh
      - name: Validate generated Compose configuration
        run: |
          python scripts/configure.py --site deploy/site.example.json --output "$RUNNER_TEMP/tailnet-runtime"
          docker compose --env-file "$RUNNER_TEMP/tailnet-runtime/compose.env" -f deploy/compose.yaml --profile '*' config --quiet
