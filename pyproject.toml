readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1,<7",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "podman-compose>=1.6,<2",
]
